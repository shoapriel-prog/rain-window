<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07121c">
<title>Rain on the window</title>
<style>
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #07121c;
}
body { min-height: 100svh; }
canvas {
  display: block;
  width: 100%;
  height: 100%;
  position: fixed;
  inset: 0;
  opacity: 0;
  transition: opacity 1.2s ease;
}
body.ready canvas { opacity: 1; }
.fallback, noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  padding: 32px;
  background:
    radial-gradient(ellipse at 70% 65%, #35271b 0, transparent 35%),
    radial-gradient(ellipse at 24% 50%, #103c46 0, transparent 45%), #07121c;
  color: #d7e5e8;
  font: 16px/1.65 system-ui, sans-serif;
  text-align: center;
}
.fallback p { max-width: 32rem; margin: 0; }
.ready .fallback { visibility: hidden; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="fallback" role="status"><p id="status">A rainy window is loading.<br>This view needs WebGL 2 and an internet connection.</p></div>
<noscript>Enable JavaScript to see the rain on the window.</noscript>
<script type="module">
const status = document.getElementById('status');
const canvas = document.createElement('canvas');
let renderer;
let frame = 0;
let state = 'loading';
function fallback(message) {
  state = 'unavailable';
  cancelAnimationFrame(frame);
  document.body.classList.remove('ready');
  status.textContent = message;
}
try {
  const context = canvas.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });
  if (!context) {
    fallback('This rainy window needs WebGL 2. Try a browser with hardware acceleration enabled.');
  } else {
    const THREE = await import('three');
    renderer = new THREE.WebGLRenderer({ canvas, context, antialias: false, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    document.body.appendChild(canvas);
    const uniforms = { uTime: { value: 0 }, uResolution: { value: new THREE.Vector2() } };
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: `void main(){gl_Position=vec4(position.xy,0.,1.);}`,
      fragmentShader: `
precision highp float;
uniform float uTime;
uniform vec2 uResolution;
float hash(float n){return fract(sin(n*127.1)*43758.5453123);}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float bead(vec2 q,vec2 radius){
  float d=length(q/radius);
  return sqrt(max(0.,1.-d*d))*(1.-smoothstep(.88,1.,d));
}
float movingWater(vec2 p,float scale,float seed){
  vec2 g=p*scale;
  float column=floor(g.x);
  float total=0.;
  for(int k=-1;k<=1;k++){
    float id=column+float(k);
    float r=hash(id+seed);
    float speed=.17+r*.24;
    float time=uTime*speed;
    float row=floor((g.y+time)/2.8);
    vec2 q=vec2(g.x-id-.5,(g.y+time)-row*2.8-1.4);
    float n=hash(id*23.7+row*41.3+seed);
    float center=(r-.5)*.43;
    center+=sin(q.y*2.1+r*19.)*.028;
    q.x-=center;
    float size=mix(.075,.16,n);
    float head=bead(q,vec2(size,size*1.55));
    float trailLength=mix(.7,1.25,r);
    float trailFade=(1.-smoothstep(0.,trailLength,q.y))*smoothstep(-.03,.12,q.y);
    float width=.018+size*.12;
    float trailDistance=q.x/width;
    float trail=exp(-trailDistance*trailDistance)*trailFade*.23;
    float pearls=bead(vec2(q.x,q.y-.31),vec2(size*.32,size*.5))*.32;
    total+=head+trail+pearls;
  }
  return total;
}
float water(vec2 p){
  float h=movingWater(p,8.,4.3)*.78+movingWater(p+vec2(.21,.1),13.,19.1)*.45;
  vec2 grid=p*38.;
  vec2 cell=floor(grid);
  for(int x=-1;x<=1;x++){
    for(int y=-1;y<=1;y++){
      vec2 id=cell+vec2(float(x),float(y));
      float n=hash2(id);
      vec2 center=vec2(hash2(id+4.7),hash2(id+9.2))*.68+.16;
      vec2 q=grid-id-center;
      float radius=mix(.035,.15,n*n);
      h+=bead(q,vec2(radius,radius*1.18))*.2*smoothstep(.30,.55,n);
    }
  }
  return h;
}
vec3 city(vec2 p){
  vec3 c=vec3(.018,.045,.065);
  c+=vec3(.025,.12,.14)*exp(-length((p-vec2(-.28,.03))*vec2(2.,1.7))*2.);
  c+=vec3(.14,.067,.024)*exp(-length((p-vec2(.4,-.2))*vec2(2.,2.))*2.);
  for(int i=0;i<48;i++){
    float f=float(i);
    float n=hash(f+12.);
    vec2 center=vec2((hash(f+6.1)-.5)*2.5,(hash(f+18.7)-.5)*1.5-.05);
    float radius=mix(.013,.075,pow(hash(f+2.1),2.));
    vec2 q=p-center;
    q.y*=mix(.75,1.3,hash(f+9.));
    float d=length(q);
    float disc=1.-smoothstep(radius*.55,radius*1.35,d);
    float halo=exp(-d*d/(radius*radius*5.));
    vec3 color=mix(vec3(.08,.56,.64),vec3(1.,.47,.12),step(.43,n));
    color=mix(color,vec3(.62,.75,.70),step(.89,n));
    float brightness=mix(.24,.85,hash(f+33.));
    c+=color*brightness*(disc*.55+halo*.15);
    float reflection=exp(-abs(q.x)/(radius*.7))*exp(-abs(q.y+.28)/.25);
    c+=color*reflection*.023*(1.-smoothstep(-.16,0.,p.y-center.y));
  }
  return c;
}
void main(){
  vec2 p=(gl_FragCoord.xy-.5*uResolution)/uResolution.y;
  float e=1.5/uResolution.y;
  float h=water(p);
  vec2 slope=vec2(water(p+vec2(e,0.))-h,water(p+vec2(0.,e))-h)/e;
  vec2 refraction=clamp(slope*.008,vec2(-.095),vec2(.095));
  vec3 color=city(p+refraction);
  float edge=clamp(length(slope)*.035,0.,1.);
  color*=1.-edge*.28;
  vec3 normal=normalize(vec3(slope*.11,1.));
  float gleam=pow(max(dot(normal,normalize(vec3(-.45,.7,.65))),0.),19.);
  color+=vec3(.42,.66,.7)*gleam*smoothstep(.02,.12,h)*.42;
  color+=vec3(.06,.13,.15)*edge*.12;
  float vignette=1.-smoothstep(.25,1.15,length(p*vec2(.85,1.)));
  color*=.53+.47*vignette;
  float grain=hash2(gl_FragCoord.xy+floor(uTime*24.))-.5;
  color+=grain*.007;
  color=vec3(1.)-exp(-color*1.65);
  color=pow(max(color,0.),vec3(.86));
  gl_FragColor=vec4(color,1.);
}`,
      depthTest: false,
      depthWrite: false
    });
    const scene = new THREE.Scene();
    const geometry = new THREE.PlaneGeometry(2, 2);
    scene.add(new THREE.Mesh(geometry, material));
    const camera = new THREE.Camera();
    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.getDrawingBufferSize(uniforms.uResolution.value);
    }
    resize();
    window.addEventListener('resize', resize);
    let previous = performance.now();
    function draw(now) {
      if (state === 'unavailable') return;
      uniforms.uTime.value += Math.min((now - previous) / 1000, .05);
      previous = now;
      try {
        renderer.render(scene, camera);
        if (state === 'loading') {
          if (context.getError() !== context.NO_ERROR) throw new Error('Rendering unavailable');
          state = 'running';
          document.body.classList.add('ready');
        }
        frame = requestAnimationFrame(draw);
      } catch {
        fallback('The rainy window could not render. Try reloading with hardware acceleration enabled.');
      }
    }
    canvas.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      fallback('The graphics connection was interrupted. Reload to return to the rainy window.');
    });
    document.addEventListener('visibilitychange', () => {
      cancelAnimationFrame(frame);
      if (!document.hidden && state !== 'unavailable') {
        previous = performance.now();
        frame = requestAnimationFrame(draw);
      }
    });
    frame = requestAnimationFrame(draw);
  }
} catch {
  fallback('The rainy window could not load. Check your internet connection and reload in a browser with WebGL 2.');
}
</script>
</body>
</html>
